name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate Gradle project
        id: find
        run: |
          F=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)
          if [ -z "$F" ]; then
            echo "::error::settings.gradle not found anywhere in the repo. Files in repo:"
            find . -not -path './.git/*' -type f | head -n 100
            exit 1
          fi
          DIR=$(dirname "$F")
          echo "Project found in: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: entidade1980-mod
          path: ${{ steps.find.outputs.dir }}/build/libs/*.jar
